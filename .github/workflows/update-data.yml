name: تحديث بيانات الرادار

on:
  schedule:
    # كل 12 ساعة (بتوقيت UTC). عدّل حسب رغبتك: */6 كل 6 ساعات، 0 3 * * * مرة يوميًا الساعة 3 صباحًا UTC...
    - cron: "0 */12 * * *"
  workflow_dispatch: {} # يسمح بتشغيل التحديث يدويًا من تبويب Actions في GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: تشغيل سكربت التحديث
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node update-data.mjs

      - name: Commit ودفع data.json إن تغيّر
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "لا تغييرات — لن يتم عمل commit"
          else
            git add data.json
            git commit -m "تحديث تلقائي لبيانات المشاريع - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
